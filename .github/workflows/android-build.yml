name: Android build

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # versionCode auto-increments with every workflow run (never a manual step, so it can never be
      # forgotten or collide) — see docs/PLAN.md "핵심 설계: 버전 번호 자동화".
      - name: Run domain unit tests
        run: ./gradlew :domain:test --stacktrace

      # BuildConfig generation reads these at configure time even for unit tests (see app/build.gradle.kts) —
      # without them the compile step still succeeds (falls back to a blank string), so this isn't required
      # for the tests to run, but keeping it consistent with the assemble step below avoids surprises.
      - name: Run app unit tests
        env:
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Show preview build config
        run: grep -n -A8 'create("preview")' app/build.gradle.kts

      - name: Build preview APK
        env:
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          ./gradlew :app:assemblePreview --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName="0.1.1-preview.${{ github.run_number }}+${{ github.sha }}"

      - name: Show preview APK size
        run: |
          ls -lh app/build/outputs/apk/preview/app-preview.apk
          stat -c 'bytes=%s' app/build/outputs/apk/preview/app-preview.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: booklogs-preview-${{ github.run_number }}.apk
          path: app/build/outputs/apk/preview/app-preview.apk
          archive: false
          if-no-files-found: error
