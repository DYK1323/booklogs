name: Android build

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # versionCode auto-increments with every workflow run (never a manual step, so it can never be
      # forgotten or collide) — see docs/PLAN.md "핵심 설계: 버전 번호 자동화".
      - name: Run domain unit tests
        run: ./gradlew :domain:test --stacktrace

      - name: Build debug APK
        env:
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName="0.1.0-preview.${{ github.run_number }}+${{ github.sha }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: booklogs-debug-${{ github.run_number }}.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
